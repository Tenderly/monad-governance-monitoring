# Alternative with NO alerts: one Web3 Action with a transaction trigger (deploy with the Tenderly CLI).
# It runs when a watched contract emits any listed governance topic0 (OR across entries, matchAny
# matches the topic at any position; the action re-checks topic0). One entry per watched contract
# AND per chain: never leave contract.address empty, an unpinned filter would scan every transaction
# with logs on the network. A contract on Ethereum gets its own entry with `network: 1` (the guard
# reads the network from the payload and has Ethereum in CONFIG.networks). The tag-based alerts need
# none of this: they cover every chain a tagged contract lives on.
# Set CONFIG.onlyListedContracts = true and list the same contracts in CONFIG.contracts.
# Every 0x address and topic below is quoted on purpose, so YAML 1.1 parsers keep it as a string
# (unquoted, they can read it as a number). Keep the quotes when you add entries.
account_id: ""
project_slug: ""
actions:
  your-account/your-project:
    runtime: v2
    sources: actions
    specs:
      privChangeGuardTx:
        description: Privileged change guard (transaction trigger, no alerts)
        function: privChangeGuard:actionFn
        execution_type: sequential
        trigger:
          type: transaction
          transaction:
            status:
              - mined
            filters:
              - network: 143
                logEmitted:
                  contract:
                    address: "0x1111111111111111111111111111111111111111"   # example watched contract 1, replace with yours
